name: sporthub

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sporthub}
      POSTGRES_USER: ${POSTGRES_USER:-sporthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env or use scripts/Start-SportHub.ps1}
    volumes:
      - sporthub_pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - sporthub_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  api:
    build: ./backend
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SEED_DEMO_EVENTS: ${SEED_DEMO_EVENTS:-true}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-sporthub}:${POSTGRES_PASSWORD:?Create .env or use scripts/Start-SportHub.ps1}@db:5432/${POSTGRES_DB:-sporthub}
      JWT_SECRET: ${JWT_SECRET:?Create .env or use scripts/Start-SportHub.ps1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sporthub.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Create .env or use scripts/Start-SportHub.ps1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sporthub_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sporthub_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sporthub_pgdata:

networks:
  sporthub_internal:
    driver: bridge
